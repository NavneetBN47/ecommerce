openapi: 3.0.3
info:
  title: E-Commerce Platform API
  description: |
    Complete API documentation for the E-Commerce Platform microservices architecture.
    
    This platform consists of three main microservices:
    - **User Management Service**: Handles user registration, authentication, and profile management
    - **Product Catalog Service**: Manages product inventory, catalog, and search functionality
    - **Shopping Cart Service**: Manages shopping cart operations and checkout
    
    ## Authentication
    Most endpoints require JWT Bearer token authentication. Obtain a token by:
    1. Register a new user via `/api/users/register`
    2. Login via `/api/users/login`
    3. Use the returned token in the Authorization header: `Bearer <token>`
  version: 1.0.0
  contact:
    name: E-Commerce Platform Team
    email: support@ecommerce.com
  license:
