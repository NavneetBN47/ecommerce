spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

logging:
  level:
    root: WARN
    com.ecommerce: INFO

jwt:
  secret: ${JWT_SECRET}  # Must be provided via environment variable

server:
  port: 8080